# Temporary scheduler probe; removed after collecting evidence.
# Production gate is copied verbatim except fixture ref/event and dependency names.
name: Temporary deployment gate scheduler probe
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  regression_success:
    runs-on: ubuntu-latest
    steps:
      - name: Node result fixture
        run: exit 0
      - name: Chromium result fixture
        run: exit 0
  publish_success:
    needs: regression_success
    if: |-
      ${{ needs.regression_success.result == 'success' &&
          'refs/heads/main' == 'refs/heads/main' &&
          ('push' == 'push' || 'push' == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publication sentinel (no Pages API)
        run: echo "Eligible for publication; no website is deployed by this probe."
  regression_node_failure:
    runs-on: ubuntu-latest
    steps:
      - name: Node result fixture
        run: exit 1
      - name: Chromium result fixture
        run: exit 0
  publish_node_failure:
    needs: regression_node_failure
    if: |-
      ${{ needs.regression_node_failure.result == 'success' &&
          'refs/heads/main' == 'refs/heads/main' &&
          ('push' == 'push' || 'push' == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publication sentinel (no Pages API)
        run: echo "Eligible for publication; no website is deployed by this probe."
  regression_browser_failure:
    runs-on: ubuntu-latest
    steps:
      - name: Node result fixture
        run: exit 0
      - name: Chromium result fixture
        run: exit 1
  publish_browser_failure:
    needs: regression_browser_failure
    if: |-
      ${{ needs.regression_browser_failure.result == 'success' &&
          'refs/heads/main' == 'refs/heads/main' &&
          ('push' == 'push' || 'push' == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publication sentinel (no Pages API)
        run: echo "Eligible for publication; no website is deployed by this probe."
  verify:
    if: ${{ always() }}
    needs:
      - regression_success
      - publish_success
      - regression_node_failure
      - publish_node_failure
      - regression_browser_failure
      - publish_browser_failure
    runs-on: ubuntu-latest
    steps:
      - name: Assert real scheduler outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          python - <<'PY'

          import json, os

          results = json.loads(os.environ['RESULTS'])

          expected = {'regression_success':'success',
          'publish_success':'success', 'regression_node_failure':'failure',
          'publish_node_failure':'skipped',
          'regression_browser_failure':'failure',
          'publish_browser_failure':'skipped'}

          actual = {name: job['result'] for name, job in results.items()}

          print(json.dumps(actual, indent=2))

          assert actual == expected, (actual, expected)

          print('PASS: success reaches publication; either regression failure
          skips publication')

          PY
