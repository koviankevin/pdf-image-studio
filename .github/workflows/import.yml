name: Import initial website
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and extract uploaded source
        run: |
          cat source.zip.001 source.zip.002 > /tmp/website-source.zip
          echo '57031c287855bdd4c602a13c11bee3b8c933ad350b5e7625b9e337d6f74da0ba  /tmp/website-source.zip' | sha256sum --check
          unzip -q /tmp/website-source.zip
          git add README.md serve.mjs .gitignore dist
          git rm source.zip.001 source.zip.002
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete PDF workspace and bundled resources'
          git push
